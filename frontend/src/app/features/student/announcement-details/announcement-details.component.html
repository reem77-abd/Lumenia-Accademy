<div class="page">
  <div class="card">
    <button class="btn ghost" (click)="back()">← Back to announcements</button>

    <div *ngIf="loading">Loading...</div>
    <div class="error" *ngIf="!loading && error">{{ error }}</div>

    <div *ngIf="!loading && !error && announcement" class="details">
      <h1>{{ announcement.title }}</h1>
      <div class="meta">
        <span>{{ announcement.teacher_name || "Teacher" }}</span>
        <span class="dot">•</span>
        <span>{{ fmt(announcement.created_at) }}</span>
      </div>
      <div class="content" [innerText]="announcement.content"></div>
    </div>
  </div>
</div>
